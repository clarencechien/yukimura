name: Publish game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:pages
      - name: Check out the approved 2D game
        uses: actions/checkout@v4
        with:
          ref: 44d6f935102fc9361146504a06467841fd25a663
          path: .jigoku
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/routes/jigoku-2d/play/
            /docs/routes/jigoku-2d/combat/
            /tests/jigoku-battle.test.mjs
            /tools/build_jigoku_play.mjs
            /tools/check_jigoku_level_browser.mjs
      - name: Build and verify the 2D game
        working-directory: .jigoku
        run: |
          node --test tests/jigoku-battle.test.mjs
          node tools/build_jigoku_play.mjs
          CHROMIUM_PATH="$(node -p "require('@playwright/test').chromium.executablePath()")" node tools/check_jigoku_level_browser.mjs
      - name: Add the 2D game to the Pages site
        run: |
          mkdir -p dist/jigoku
          cp .jigoku/.tmp/jigoku-release/index.html dist/jigoku/index.html
          cp .jigoku/.tmp/jigoku-release/PHASER-LICENSE.md dist/jigoku/PHASER-LICENSE.md
          cp .jigoku/docs/routes/jigoku-2d/play/sanada-jigoku.zip dist/jigoku/sanada-jigoku.zip
          git -C .jigoku rev-parse HEAD > dist/jigoku/version.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
