</style></head><body><a href="../FREE_ARM_SUPPORT.md">← 製作紀錄</a><h1>跪姿接地・屈肘承力</h1><p>伸手放下掌根，接地後保持手掌位置，肩胸下沉時讓固定長度手臂屈肘。</p><p class="note">這是<strong>獨立跪姿承力段，尚未接上蹲姿過渡或替換戰鬥</strong>。掌根是人工平面接點，不是物理受力或三維手掌模擬。</p>
<fieldset id="controls" disabled><button id="play">播放 ×¼</button><label>進度 <input id="time" type="range" min="330" max="540" step="1" value="420"> <output id="age">420 ms</output></label><label><input id="joints" type="checkbox">顯示接點</label><label><input id="arm" type="checkbox" checked>顯示手臂</label><label><input id="cap" type="checkbox" checked>肩甲遮擋</label></fieldset>
<canvas id="view" width="1200" height="660" aria-label="跪姿接地與掌根固定放大檢視"></canvas><p id="status" role="status">正在載入部件…</p><p>85／90 px 上臂與前臂沿用前輪貼圖；新增跪地底圖與專用撐掌。420 ms 鎖定掌根，之後肩胸下降 8 px，膝腳保持原位。腕角限制只是平面投影檢查。</p><script type="module" src="review.mjs"></script></body></html>
