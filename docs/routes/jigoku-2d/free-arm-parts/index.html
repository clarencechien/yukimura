<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空手部件・可動試裝</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#11191d;color:#e8deca}body{max-width:1200px;margin:auto;padding:24px}h1{font-weight:500;letter-spacing:.08em}p{line-height:1.7;color:#bcc8c9}a{color:#ddbb7e}canvas{width:100%;height:auto;display:block;background:#19252c}fieldset{border:1px solid #42535b;border-radius:8px;display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin:18px 0;padding:15px}button,select{padding:10px 16px;background:#283b43;color:#f1e3ca;border:1px solid #60767d;border-radius:5px;font:inherit}input[type=range]{width:min(380px,55vw)}.note{border-left:3px solid #d9b574;padding:14px;background:#243139}@media(max-width:650px){body{padding:12px}h1{font-size:24px}}
</style></head><body><a href="../FREE_ARM_PARTS.md">← 製作紀錄</a><h1>空手部件・可動試裝</h1><p>同一組上臂、前臂與手掌，接上固定骨架；肩甲覆蓋肩部接縫，袖口覆蓋腕部接點。</p><p class="note">這是固定蹲姿的伸手預備，<strong>手掌尚未接地，也未套入戰鬥</strong>。兩張手形切換，不是連續手指動畫。底圖修補仍有造型差異。</p>
<fieldset id="controls" disabled><button id="play">播放 ×¼</button><label>進度 <input id="time" type="range" min="180" max="420" step="1" value="250"> <output id="age">250 ms</output></label><label>手形 <select id="hand"><option value="auto">自動：半握 → 張掌</option><option value="relax">半握</option><option value="open">張掌</option></select></label><label><input id="joints" type="checkbox">顯示接點</label><label><input id="arm" type="checkbox" checked>顯示手臂</label><label><input id="cap" type="checkbox" checked>肩甲遮擋</label></fieldset>
<canvas id="view" width="1200" height="660" aria-label="固定蹲姿組裝與手臂放大檢視"></canvas><p id="status" role="status">正在載入部件…</p><p>85／90 px 固定臂長；手掌跟隨前臂方向，平面腕部不反折。上臂、前臂、半握手與張掌皆沿用既有素材。這裡的時間只是前輪伸手曲線的取樣，不代表遊戲全身正在下沉。</p><script type="module" src="review.mjs"></script></body></html>
