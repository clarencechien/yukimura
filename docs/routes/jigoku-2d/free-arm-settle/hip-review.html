<style>:root{color-scheme:dark;font-family:system-ui;background:#11191d;color:#e8deca}body{max-width:1240px;margin:auto;padding:24px}a{color:#ddbb7e}p{line-height:1.7;color:#bcc8c9}button{font:inherit;padding:10px;background:#283b43;color:inherit;border:1px solid #60767d}fieldset{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid #42535b;margin:20px 0}input{width:min(360px,65vw)}#views,#feet{display:grid;grid-template-columns:1fr 1fr;gap:12px}#feet{max-width:600px;margin:16px auto}#feet canvas{width:250px;max-width:100%;margin:auto}figure{margin:0;background:#19252c}canvas{display:block;width:100%;height:auto}figcaption{padding:12px}iframe{position:absolute;left:-10000px;width:1280px;height:1100px;border:0}@media(max-width:650px){body{padding:12px}#views,#feet{grid-template-columns:1fr}}</style>
<body><a href="index.html">完整動作</a> · <a href="../FREE_ARM_SETTLE.md">製作紀錄</a><h1>腰甲過渡原畫 · 試作比較</h1><p>左側是目前預設動作；右側在 1200–1240 ms 的低頭過渡格，換入較直立的兩片裙甲。原骨架、頭盔、肩甲、雙臂、護脛與刀相同；身體外輪廓也保留原圖。</p>
<fieldset id="controls" disabled><button id="play">播放（¼ 倍）</button><label>進度 <input id="time" type="range" min="1000" max="1500" value="1000" step=".001"> <output id="age">1000 ms</output></label><button data-time="1199.999">進入前</button><button data-time="1200.001">進入新稿</button><button data-time="1239.999">離開新稿前</button><button data-time="1240.001">離開新稿後</button></fieldset>
<div id="views"><figure><figcaption>目前預設 · 原腰甲</figcaption><canvas width="600" height="260" id="before" aria-label="原腰甲"></canvas></figure><figure><figcaption>試作 · 腰甲重繪</figcaption><canvas width="600" height="260" id="after" aria-label="腰甲新稿"></canvas></figure></div><p>腰甲放大 2 倍 · 同一時間的實際畫布裁切</p><div id="feet"><figure><figcaption>目前預設 · 原腰甲</figcaption><canvas width="250" height="230" id="foot-before" aria-label="前輪腰甲放大"></canvas></figure><figure><figcaption>試作 · 直立雙甲片</figcaption><canvas width="250" height="230" id="foot-after" aria-label="本輪腰甲放大"></canvas></figure></div><p id="status" role="status">正在載入兩個版本…</p><p>試作尚未採用為預設。腰甲造型有所改變，但首次及下一個身體交接的全彩差異均略增；骨盆與胸腰遮擋仍須整體過渡原畫。兩張生成來源與實際換圖量測皆保留；影片是瀏覽器播放錄製，並非生成影片。</p>
