<body><a href="index.html">完整動作</a> · <a href="../FREE_ARM_SETTLE.md">製作紀錄</a><h1>肩甲先轉落，再接側倒</h1><p>左側為上一輪：肩甲跟著胸部直到換圖。右側在離掌後，先讓原肩甲逐漸轉落；移開時露出從既有側倒圖對齊的頸肩內層。兩邊身體、頭盔、雙臂與刀的動作相同。</p>
<fieldset id="controls" disabled><button id="play">播放（¼ 倍）</button><label>進度 <input id="time" type="range" min="960" max="1280" value="960" step=".001"> <output id="age">960 ms</output></label><button data-time="1000">離掌起點</button><button data-time="1100">肩甲轉落</button><button data-time="1199.999">換圖前</button><button data-time="1200.001">換圖後</button></fieldset>
