<style>:root{color-scheme:dark;font-family:system-ui;background:#11191d;color:#e8deca}body{max-width:1240px;margin:auto;padding:24px}a{color:#ddbb7e}p{line-height:1.7;color:#bcc8c9}button{font:inherit;padding:10px;background:#283b43;color:inherit;border:1px solid #60767d}fieldset{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid #42535b;margin:20px 0}input{width:min(360px,65vw)}#views{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0;background:#19252c}canvas{display:block;width:100%;height:auto}figcaption{padding:12px}iframe{position:absolute;left:-10000px;width:1280px;height:1100px;border:0}@media(max-width:650px){body{padding:12px}#views{grid-template-columns:1fr}}</style>
<body><a href="index.html">完整動作</a> · <a href="../FREE_ARM_SETTLE.md">製作紀錄</a><h1>共用肩甲：連續轉動與襯布補底</h1><p>左側為上一輪共用頭盔版，右側在 1220 ms 後再共用同一片肩甲。兩邊身體、頭盔、雙臂與刀的動作相同；右側肩甲連續轉動，內襯補住甲片移開的區域。</p>
<fieldset id="controls" disabled><button id="play">播放（¼ 倍）</button><label>進度 <input id="time" type="range" min="1200" max="1540" value="1200" step=".001"> <output id="age">1200 ms</output></label><button data-time="1220">開始共用</button><button data-time="1380">比較肩甲</button><button data-time="1240.001">換格之後</button><button data-time="1500">末姿</button></fieldset>
<div id="views"><figure><figcaption>前輪共用頭盔 · 肩甲隨身體換圖</figcaption><canvas width="600" height="260" id="before" aria-label="肩甲隨身體換圖"></canvas></figure><figure><figcaption>共用肩甲 · 同一片甲與襯布補底</figcaption><canvas width="600" height="260" id="after" aria-label="共用肩甲連續轉動"></canvas></figure></div><p id="status" role="status">正在載入兩個版本…</p><p>保留 1200 ms 的原交接，後三次換圖使用同一肩甲。既有暗色襯布在甲片後補底，沒有拉伸身體或交叉淡化；身體、腰甲輪廓及頸部其他邊線仍會換格，尚未替換正式遊戲。</p>
