<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收腳接續・保留原膝甲</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#11191d;color:#e8deca}body{max-width:1200px;margin:auto;padding:24px}h1{font-weight:500;letter-spacing:.08em}p{line-height:1.7;color:#bcc8c9}a{color:#ddbb7e}canvas{width:100%;height:auto;display:block;background:#19252c}fieldset{border:1px solid #42535b;border-radius:8px;display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin:18px 0;padding:15px}button,select{padding:10px 16px;background:#283b43;color:#f1e3ca;border:1px solid #60767d;border-radius:5px;font:inherit}input[type=range]{width:min(380px,55vw)}.note{border-left:3px solid #d9b574;padding:14px;background:#243139}@media(max-width:650px){body{padding:12px}h1{font-size:24px}}
</style></head><body><a href="../FREE_ARM_SETTLE.md">← 製作紀錄</a><h1>收腳接續・保留原膝甲</h1><p>左側保留前輪換姿；右側先讓掌根接地，再轉動護脛與鞋，收進衣甲遮擋後方。</p><p class="note">獨立試作，尚未替換遊戲。近地起保留原圖膝甲／腰帶，400 ms 不再切換整張下身；修補圖只補護脛與鞋移開後的區域。可查看被遮腳部與修補範圍，前段原畫換姿及裁邊仍待精修。</p><fieldset id="controls" disabled><button id="play">播放</button><label>速度 <select id="speed"><option value=".25">¼ 倍</option><option value="1">原速</option></select></label><button id="prev">上一姿勢</button><button id="next">下一姿勢</button><label>進度 <input id="time" type="range" min="330" max="540" step=".001" value="330"> <output id="age">330 ms</output></label><label><input id="joints" type="checkbox">顯示接點</label><label><input id="arm" type="checkbox" checked>顯示手臂</label><label><input id="cap" type="checkbox" checked>肩甲遮擋</label><label><input id="xray" type="checkbox">查看被遮腳部</label><label><input id="patch" type="checkbox">修補範圍</label></fieldset><canvas id="view" width="1200" height="720" aria-label="前輪換圖與固定部件收腳的實際動畫比較"></canvas><p id="status" role="status">正在載入部件…</p><p>共用 85／90 px 手臂與撐掌，420 ms 後鎖定掌根。人工平面接點只用於貼圖接合，不代表真實受力或解剖驗證。</p><script type="module" src="review.mjs"></script></body></html>
