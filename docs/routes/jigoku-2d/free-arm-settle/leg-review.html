<body><a href="index.html">完整動作</a> · <a href="../FREE_ARM_SETTLE.md">製作紀錄</a><h1>同一組護脛與靴子，接續側倒</h1><p>左側整張下身換姿；右側把末張原畫的護脛與靴子拆出共用，在大腿後方逐漸滑出。兩邊時間、身體骨架、頭盔、肩甲、雙臂與刀相同。</p>
<fieldset id="controls" disabled><button id="play">播放（¼ 倍）</button><label>進度 <input id="time" type="range" min="1180" max="1540" value="1180" step=".001"> <output id="age">1180 ms</output></label><button data-time="1220">低頭過渡</button><button data-time="1260">開始側移</button><button data-time="1320.001">膝部翻落</button><button data-time="1500">落定</button></fieldset>
<div id="views"><figure><figcaption>前輪 · 護脛與靴跟著下身換圖</figcaption><canvas width="600" height="260" id="before" aria-label="下身換圖"></canvas></figure><figure><figcaption>本輪 · 同一護脛與靴在大腿後方滑出</figcaption><canvas width="600" height="260" id="after" aria-label="共用護脛與靴"></canvas></figure></div><p id="status" role="status">正在載入兩個版本…</p><p>後三個身體交接減少靴尖跳位；1200 ms 首次拆分仍有換圖，且整體色差略增。腰甲與膝部仍是四張原畫，這是固定尺寸的平面滑移，並非膝關節或受力模擬，尚未替換正式遊戲。</p>
