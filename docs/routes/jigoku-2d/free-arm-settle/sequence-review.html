<body><a href="index.html">完整動作</a> · <a href="../BODY_SEQUENCE.md">製作紀錄</a><h1>胸腰三姿勢與貼地接續 · 試作比較</h1><p>左側是目前預設動作；右側在 1200–1440 ms 換入一起製作的三張胸甲、骨盆與膝部原畫。頭盔、雙臂、肩甲、護脛與刀沿用原動作；身體只做剛性微轉，保持肩點及下緣接地。</p>
