<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>護脛接續同步比較</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#11191d;color:#e8deca}body{max-width:1240px;margin:auto;padding:24px}a{color:#ddbb7e}p{line-height:1.7;color:#bcc8c9}button{font:inherit;padding:10px;background:#283b43;color:inherit;border:1px solid #60767d}fieldset{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid #42535b;margin:20px 0}input{width:min(360px,65vw)}#views,#feet{display:grid;grid-template-columns:1fr 1fr;gap:12px}#feet{max-width:600px;margin:16px auto}#feet canvas{width:270px;max-width:100%;margin:auto}figure{margin:0;background:#19252c}canvas{display:block;width:100%;height:auto}figcaption{padding:12px}iframe{position:absolute;left:-10000px;width:1280px;height:1100px;border:0}@media(max-width:650px){body{padding:12px}#views,#feet{grid-template-columns:1fr}}</style>
<body><a href="index.html">完整動作</a> · <a href="../FREE_ARM_SETTLE.md">製作紀錄</a><h1>先放低護脛，再接側倒</h1><p>左側下身保持不動直到換圖；右側在離掌後，讓原護脛與靴子逐漸放低，再接上一輪的共用側倒部件。頭盔、腰甲、雙臂與刀保持相同。</p>
<fieldset id="controls" disabled><button id="play">播放（¼ 倍）</button><label>進度 <input id="time" type="range" min="960" max="1280" value="960" step=".001"> <output id="age">960 ms</output></label><button data-time="1000">離掌起點</button><button data-time="1100">護脛放低</button><button data-time="1199.999">換圖前</button><button data-time="1200.001">換圖後</button></fieldset>
<div id="views"><figure><figcaption>前輪 · 護脛固定到換圖</figcaption><canvas width="600" height="260" id="before" aria-label="原護脛固定"></canvas></figure><figure><figcaption>本輪 · 護脛與靴先放低</figcaption><canvas width="600" height="260" id="after" aria-label="護脛提前放低"></canvas></figure></div><p>腳部放大 3 倍 · 同一時間的實際畫布裁切</p><div id="feet"><figure><figcaption>前輪 · 靴尖固定</figcaption><canvas width="270" height="210" id="foot-before" aria-label="前輪靴尖放大"></canvas></figure><figure><figcaption>本輪 · 靴尖逐漸放低</figcaption><canvas width="270" height="210" id="foot-after" aria-label="本輪靴尖放大"></canvas></figure></div><p id="status" role="status">正在載入兩個版本…</p><p>這次只減輕首次交接的靴尖跳位；腰甲與大腿輪廓仍會換圖。護脛與靴子保持原大小，一起作平面旋轉和平移；沒有拉伸、淡化或布料模擬，尚未替換正式遊戲。</p>
