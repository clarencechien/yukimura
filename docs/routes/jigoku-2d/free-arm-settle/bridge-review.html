<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>低頭過渡同步比較</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#11191d;color:#e8deca}body{max-width:1240px;margin:auto;padding:24px}a{color:#ddbb7e}p{line-height:1.7;color:#bcc8c9}button{font:inherit;padding:10px;background:#283b43;color:inherit;border:1px solid #60767d}fieldset{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid #42535b;margin:20px 0}input{width:min(360px,65vw)}#views{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0;background:#19252c}canvas{display:block;width:100%;height:auto}figcaption{padding:12px}iframe{position:absolute;left:-10000px;width:1280px;height:1100px;border:0}@media(max-width:650px){body{padding:12px}#views{grid-template-columns:1fr}}</style>
<body><a href="index.html">完整動作</a> · <a href="../FREE_ARM_SETTLE.md">製作紀錄</a><h1>低頭過渡：同步看兩個版本</h1><p>左側為原三格，右側在 1200–1240 ms 加入既有低頭稿；1260 ms 後接回相同動作。這是實際 Canvas 同步播放，仍有原畫換格，尚非連續頭頸動畫。</p>
<fieldset id="controls" disabled><button id="play">播放（¼ 倍）</button><label>進度 <input id="time" type="range" min="1180" max="1540" value="1180" step=".001"> <output id="age">1180 ms</output></label><button data-time="1200">進入過渡前</button><button data-time="1220">過渡中</button><button data-time="1240.001">接回原畫</button><button data-time="1500">末姿</button></fieldset>
<div id="views"><figure><figcaption>原三格 · 1220 ms 一次換圖</figcaption><canvas width="600" height="260" id="before" aria-label="原三格側倒"></canvas></figure><figure><figcaption>加入過渡 · 1200／1240 ms 分兩次換圖</figcaption><canvas width="600" height="260" id="after" aria-label="新增低頭過渡"></canvas></figure></div><p id="status" role="status">正在載入兩個版本…</p><p>兩次身體輪廓重疊率為 79.6%／81.7%，原交接為 77.9%。全彩差異峰值略增，頭盔仍有跳位。共用雙臂和落刀；新增三張裁片約 0.469 MiB RGBA8，沒有重新生成圖片。</p>
<iframe src="index.html?motion=baseline" title="原三格繪圖來源" aria-hidden="true" tabindex="-1"></iframe><iframe src="index.html?motion=bridge" title="過渡版繪圖來源" aria-hidden="true" tabindex="-1"></iframe>
<script type="module" src="bridge-review.mjs"></script></body></html>
