<body><a href="index.html">完整動作</a> · <a href="../FREE_ARM_SETTLE.md">製作紀錄</a><h1>共用頭盔：固定造型，連續轉動</h1><p>左側為上一輪四格換圖，右側使用同一張頭盔與面部。身體、雙臂與刀的動作相同；右側頭部連續平移、旋轉。肩甲遮擋與頸部接縫仍需精修。</p>
<fieldset id="controls" disabled><button id="play">播放（¼ 倍）</button><label>進度 <input id="time" type="range" min="1160" max="1540" value="1160" step=".001"> <output id="age">1160 ms</output></label><button data-time="1180">開始拆分</button><button data-time="1220">比較頭盔</button><button data-time="1240.001">換格之後</button><button data-time="1500">末姿</button></fieldset>
<div id="views"><figure><figcaption>前輪四格 · 頭盔畫在身體圖上</figcaption><canvas width="600" height="260" id="before" aria-label="頭盔隨身體換圖"></canvas></figure><figure><figcaption>共用頭盔 · 同一素材連續轉動</figcaption><canvas width="600" height="260" id="after" aria-label="共用頭盔連續轉動"></canvas></figure></div><p id="status" role="status">正在載入兩個版本…</p><p>四次換格的身體輪廓重疊與全彩差異均改善；頭盔本身不再換圖。新增一張共用頭部與五張去頭胸甲裁片，約 1.268 MiB RGBA8。沒有新生成圖片、非等比變形或交叉淡化；這仍是平面部件試作，未替換正式遊戲。</p>
