<body><a href="index.html">完整動作</a> · <a href="../BODY_TRANSITION.md">製作紀錄</a><h1>胸腰整體過渡原畫 · 試作比較</h1><p>左側是目前預設動作；右側在 1200–1240 ms 換入一張完整胸甲、骨盆、大腿與膝部原畫。頭盔、肩甲、雙臂、護脛與刀共用原動作。這次改變身體外輪廓，不再只補繪裙甲。</p>
<fieldset id="controls" disabled><button id="play">播放（¼ 倍）</button><label>速度 <select id="speed"><option value=".25">¼ 倍</option><option value="1">原速</option></select></label><label>進度 <input id="time" type="range" min="1000" max="1500" value="1000" step=".001"> <output id="age">1000 ms</output></label><button data-time="1199.999">進入前</button><button data-time="1200.001">進入新稿</button><button data-time="1239.999">離開新稿前</button><button data-time="1240.001">離開新稿後</button></fieldset>
<div id="views"><figure><figcaption>目前預設 · 分層胸腰</figcaption><canvas width="600" height="260" id="before" aria-label="原胸腰"></canvas></figure><figure><figcaption>試作 · 完整身體原畫</figcaption><canvas width="600" height="260" id="after" aria-label="胸腰新稿"></canvas></figure></div><p>完整胸腰放大 2 倍 · 同一時間的實際畫布裁切</p><div id="feet"><figure><figcaption>目前預設 · 分層胸腰</figcaption><canvas width="450" height="360" id="foot-before" aria-label="原胸腰放大"></canvas></figure><figure><figcaption>試作 · 胸腰到膝部</figcaption><canvas width="450" height="360" id="foot-after" aria-label="新胸腰放大"></canvas></figure></div><p id="status" role="status">正在載入兩個版本…</p><p>試作尚未採用為預設。胸腰造型完整，第一稿浮起的領口也已重畫；但前後兩次換圖的輪廓與材質跳動都增加。單獨重畫一格未能保持相鄰原畫的甲片及膝部形狀。可切原速觀察；影片是 30 fps 實際瀏覽器錄製。</p>
